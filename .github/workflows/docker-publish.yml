name: Publish Docker Images

on:
  push:
    branches:
      - release/**
      - main

jobs:
  build-staging:
    name: Build & push staging images
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app image (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha,scope=staging-runner
          cache-to: type=gha,mode=max,scope=staging-runner

      - name: Build & push scripts image (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scripts
          push: true
          tags: ghcr.io/${{ github.repository }}:scripts-staging
          cache-from: type=gha,scope=staging-scripts
          cache-to: type=gha,mode=max,scope=staging-scripts

  build-production:
    name: Build & push production images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app image (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha,scope=prod-runner
          cache-to: type=gha,mode=max,scope=prod-runner

      - name: Build & push scripts image (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scripts
          push: true
          tags: ghcr.io/${{ github.repository }}:scripts
          cache-from: type=gha,scope=prod-scripts
          cache-to: type=gha,mode=max,scope=prod-scripts
