services:
  app:
    build:
      context: .
      target: dev
      args:
        FROZEN_LOCKFILE: "false"
        AGENT_PUBKEY: ${AGENT_PUBKEY:-}
        SHELL_UID: ${SHELL_UID:-1000}
        SHELL_GID: ${SHELL_GID:-1000}
    command: >
      sh -c "
        mkdir -p /run/ssh-persist &&
        [ -f /run/ssh-persist/ssh_host_ed25519_key ] || ssh-keygen -q -t ed25519 -f /run/ssh-persist/ssh_host_ed25519_key -N '' &&
        /usr/sbin/sshd -o 'HostKey /run/ssh-persist/ssh_host_ed25519_key' &&
        chown -R node:node /app/node_modules /app/.next 2>/dev/null || true &&
        exec su node -s /bin/sh -c 'pnpm exec prisma generate && { pnpm exec prisma migrate deploy || echo \"[dev] migration failed — fix then run prisma migrate deploy manually\"; } && pnpm dev'
      "
    ports: !override
      - "3001:3000"
      - "5555:5555"
      - "2222:2222"
    environment:
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: postgresql://power2plant:power2plant@db:5432/power2plant
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data/app-dev-ssh:/run/ssh-persist
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      power2plant-dev:
        aliases:
          - app-dev
  db:
    ports: !override
      - "5433:5432"
    networks:
      default: {}
      power2plant-dev:
        aliases:
          - db-dev

networks:
  power2plant-dev:
    external: true
    name: ${COMPOSE_PROJECT_NAME}-dev
