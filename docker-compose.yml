services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: power2plant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-power2plant}
      POSTGRES_DB: power2plant
    restart: unless-stopped
    volumes:
      - ${VOLUME_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U power2plant"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  app:
    build:
      context: .
      target: runner
      args:
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_KOFI_URL: ${NEXT_PUBLIC_KOFI_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://power2plant:power2plant@db:5432/power2plant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CRON_SECRET: ${CRON_SECRET}
      FEEDBACK_IP_SALT: ${FEEDBACK_IP_SALT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  cron:
    image: alpine:3.19
    restart: unless-stopped
    command: >
      sh -c "echo '0 7 * * * wget -qO /dev/null --header=\"Authorization: Bearer $$CRON_SECRET\" --post-data= http://app:3000/api/admin/feedback/digest' | crontab - && crond -f -l 8"
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default

  scripts:
    build:
      context: .
      target: scripts
    entrypoint: >
      sh -c "
        pg_isready -d \"$$DATABASE_URL\" -q 2>/dev/null ||
          echo 'WARNING: DB is not reachable';
        exec \"$$@\"
      " --
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://power2plant:power2plant@db:5432/power2plant}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_API_KEY: ${OPENROUTER_API_KEY}
      TREFLE_TOKEN: ${TREFLE_TOKEN}
    volumes:
      - ${VOLUME_DATA_DIR:-./data}/research:/app/data/research
    profiles:
      - scripts
    networks:
      - default

volumes: {}
